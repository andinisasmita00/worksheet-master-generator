<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worksheet Master Generator V5.1</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;color:#222}
.wrap{max-width:900px;margin:30px auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 24px #00000012;margin-bottom:18px}
h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-weight:700;font-size:14px}select,input,button,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px;margin-top:6px;font:inherit}
button{cursor:pointer;background:#222;color:#fff;border:0;font-weight:700}.secondary{background:#eee;color:#222}
.prompt{white-space:pre-wrap;background:#fafafa;border:1px solid #ddd;padding:14px;border-radius:10px;margin:12px 0;font-size:13px}
.hidden{display:none}.status{padding:10px;border-radius:10px;background:#f0f7ff;margin-top:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Worksheet Master Generator V5.1</h1>
<p>Generator online. Mesin prompt dan aturan inti diproses di server.</p>
<label>License Key</label><input id="license" placeholder="Masukkan license key">
<button onclick="activate()">Aktifkan</button>
<div id="status" class="status">Belum diaktifkan.</div>
</div>

<div id="app" class="card hidden">
<h2>Buat Worksheet</h2>
<div class="grid">
<div><label>Usia</label><select id="age"><option>2–3 tahun</option><option>3–4 tahun</option><option>4–5 tahun</option><option>5–6 tahun</option></select></div>
<div><label>Jumlah halaman</label><select id="pages"><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option><option>50</option><option>100</option></select></div>
<div><label>Materi</label><select id="subject"><option>Logika & problem solving</option><option>Warna & bentuk</option><option>Motorik halus</option><option>Berhitung awal</option></select></div>
<div><label>Tema</label><select id="theme"><option>Hewan lucu</option><option>Kendaraan</option><option>Buah & sayur</option><option>Alam</option><option>Ruang angkasa</option></select></div>
<div><label>Aktivitas</label><select id="activity"><option>Mencocokkan</option><option>Mewarnai</option><option>Menghitung</option><option>Tracing</option><option>Maze / Labirin</option><option>Pilih yang berbeda</option><option>Mengelompokkan</option><option>Urutan</option></select></div>
<div><label>Gaya</label><select id="style"><option>Simple flat vector</option><option>Cute cartoon</option><option>Flat vector</option></select></div>
<div><label>Karakter</label><select id="character"><option>Hewan lucu sebagai karakter</option><option>Hewan lucu</option><option>Karakter sederhana</option></select></div>
<div><label>Ukuran</label><select id="size"><option>A4 Portrait</option></select></div>
</div>
<br><button onclick="generate()">Generate Image Prompts</button>
<div id="results"></div>
</div>
</div>
<script>
let active=false;
const $=id=>document.getElementById(id);
async function activate(){
 const r=await fetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({licenseKey:$('license').value.trim()})});
 const d=await r.json();
 active=!!d.valid;
 $('status').textContent=active?'License aktif.':'License tidak valid.';
 $('app').classList.toggle('hidden',!active);
}
async function generate(){
 if(!active)return;
 const body={licenseKey:$('license').value.trim(),age:$('age').value,pages:$('pages').value,subject:$('subject').value,theme:$('theme').value,activity:$('activity').value,style:$('style').value,character:$('character').value,size:$('size').value};
 const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json();
 if(!r.ok){$('status').textContent=d.error||'Gagal';return;}
 $('results').innerHTML='';
 d.prompts.forEach((p,i)=>{
  const box=document.createElement('div');box.className='prompt';
  box.textContent=p;
  const b=document.createElement('button');b.textContent='Copy Prompt Halaman '+(i+1);b.className='secondary';
  b.onclick=()=>navigator.clipboard.writeText(p);
  box.appendChild(document.createElement('br'));box.appendChild(b);
  $('results').appendChild(box);
 });
}
</script>
</body></html>
