services:
  - type: web
    name: worksheet-master-generator-v51
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: ADMIN_KEY
        sync: false
      - key: LICENSE_SECRET
        sync: false
